services:
  - type: web
    name: frcc-spartans-stats
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "21600"
      - key: RATE_LIMIT_PER_HOUR
        value: "6"
